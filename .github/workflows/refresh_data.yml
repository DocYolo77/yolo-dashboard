name: Refresh Dashboard Data

on:
  # Nachbörslich, direkt nach NYSE-Handelsschluss: 16:05 America/New_York.
  # Zwei Cron-Einträge, da GitHub Actions keine Zeitzonen mit DST kennt —
  # beide laufen ganzjährig; der jeweils "falsche" Lauf (Markt zu diesem
  # Zeitpunkt noch nicht/schon länger geschlossen) ist unkritisch, da der
  # Build idempotent ist (kein Diff → kein Commit).
  schedule:
    - cron: '5 20 * * 1-5'   # Mo-Fr 16:05 EDT (Sommerzeit, UTC-4)
    - cron: '5 21 * * 1-5'   # Mo-Fr 16:05 EST (Winterzeit, UTC-5)

  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dashboard data
        timeout-minutes: 15
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build_data.py --out-dir data

      - name: Build full-market features (universe/ADR/RS/EMA/ATR)
        timeout-minutes: 20
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/build_market_features.py --out-dir data

      - name: Build narratives data
        timeout-minutes: 15
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/build_narratives.py --out-dir data --market-features data/market_features.json

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "📊 Update dashboard data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
